name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 调试信息占编译产物的绝大部分体积和链接时间, CI 不需要, 关掉可让依赖缓存
  # 稳定留在仓库的 10 GB 上限内, 避免被淘汰后每次冷编译。
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  publish:
    # 用 ubuntu-latest: Windows runner 排队久且编译慢。系统依赖见
    # scripts/install-dependencies.sh。
    runs-on: ubuntu-latest

    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        run: bash scripts/install-dependencies.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-workspaces
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-workspaces

      - name: Publish
        run: bash scripts/publish.sh
