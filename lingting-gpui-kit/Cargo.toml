[package]
name = "lingting-gpui-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
lingting-gpui-core.workspace = true
lingting-gpui-components.workspace = true
lingting-gpui-layout.workspace = true
lingting-gpui-nav.workspace = true

gpui-kit = { workspace = true }

# 查询主屏幕缩放，用于把窗口物理尺寸换算成 GPUI 的逻辑尺寸。
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_Graphics_Gdi"] }
# 把 assets/icons/icon.ico 写入 exe 资源区，供窗口/任务栏图标使用。
[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
